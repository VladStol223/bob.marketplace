      Node M0.3 — Baseline Flow and Quality Score
        Core capability: Map the current primary path and score clarity, recovery, accessibility, responsiveness, coherence, maintainability, and performance awareness.
        Active challenge: Audit one flow including empty/error state.
        Evidence required: Flow map and baseline score.
